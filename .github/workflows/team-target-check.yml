name: Team target preflight checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  preflight-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/test_team_test_target.mjs
