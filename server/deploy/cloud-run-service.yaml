apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cosanum-training-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
    spec:
      serviceAccountName: cosanum-api-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/cosanum-training-api:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_POOL_MAX
              value: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cosanum-api-database-url
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
